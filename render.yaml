services:
  - type: web
    name: myday-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements/prod.txt
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: myday-backend.onrender.com,127.0.0.1,localhost
      - key: CORS_ALLOWED_ORIGINS
        value: https://myday.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://myday.vercel.app
      - key: REQUIRE_VAULT_MASTER_KEY
        value: "True"
      - key: VAULT_MASTER_KEY
        generateValue: true
      - key: JWT_AUTH_COOKIE_SECURE
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: myday-db
          property: connectionString

databases:
  - name: myday-db
    plan: free